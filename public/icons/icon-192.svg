<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- Background circle -->
  <circle cx="96" cy="96" r="96" fill="#0f1117"/>
  <!-- Outer ring -->
  <circle cx="96" cy="96" r="84" fill="none" stroke="#c9a84c" stroke-width="8"/>
  <!-- Inner chip rings (decorative dashes) -->
  <circle cx="96" cy="96" r="70" fill="#1a1d27"/>
  <circle cx="96" cy="96" r="70" fill="none" stroke="#c9a84c" stroke-width="4" stroke-dasharray="18 10"/>
  <!-- Center circle -->
  <circle cx="96" cy="96" r="52" fill="#0f1117" stroke="#c9a84c" stroke-width="3"/>
  <!-- Text -->
  <text x="96" y="88" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="700" fill="#c9a84c" text-anchor="middle" dominant-baseline="middle">chip</text>
  <text x="96" y="116" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="500" fill="white" text-anchor="middle" dominant-baseline="middle">in</text>
</svg>
