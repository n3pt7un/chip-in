<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#0f1117"/>
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="224" fill="none" stroke="#c9a84c" stroke-width="20"/>
  <!-- Inner chip rings (decorative dashes) -->
  <circle cx="256" cy="256" r="186" fill="#1a1d27"/>
  <circle cx="256" cy="256" r="186" fill="none" stroke="#c9a84c" stroke-width="10" stroke-dasharray="46 28"/>
  <!-- Center circle -->
  <circle cx="256" cy="256" r="138" fill="#0f1117" stroke="#c9a84c" stroke-width="8"/>
  <!-- Text -->
  <text x="256" y="238" font-family="Inter, system-ui, sans-serif" font-size="72" font-weight="700" fill="#c9a84c" text-anchor="middle" dominant-baseline="middle">chip</text>
  <text x="256" y="306" font-family="Inter, system-ui, sans-serif" font-size="58" font-weight="500" fill="white" text-anchor="middle" dominant-baseline="middle">in</text>
</svg>
